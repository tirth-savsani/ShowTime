<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0501" />
      <stop offset="45%" stop-color="#381e05" />
      <stop offset="100%" stop-color="#170c02" />
    </linearGradient>
    <radialGradient id="wideGlow" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#f77f00" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#381e05" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#050505" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#050505" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="artWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="wideShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgWide)" />
  <rect width="1280" height="720" fill="url(#wideGlow)" />

  <!-- Right Hero Artwork Visual -->
  <g transform="translate(920, 360) scale(2.6)" filter="url(#wideShadow)">
    
        <circle cx="0" cy="0" r="45" fill="url(#artGlow)" />
        <g stroke="#ffb703" stroke-width="4" stroke-linecap="round" opacity="0.8">
          <line x1="0" y1="-65" x2="0" y2="-55" />
          <line x1="0" y1="55" x2="0" y2="65" />
          <line x1="-65" y1="0" x2="-55" y2="0" />
          <line x1="55" y1="0" x2="65" y2="0" />
          <line x1="-45" y1="-45" x2="-38" y2="-38" />
          <line x1="38" y1="38" x2="45" y2="45" />
          <line x1="45" y1="-45" x2="38" y2="-38" />
          <line x1="-38" y1="38" x2="-45" y2="45" />
        </g>
      
  </g>
  <circle cx="920" cy="360" r="280" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="8,12" />
  <circle cx="920" cy="360" r="340" fill="none" stroke="#ffb703" stroke-width="1" stroke-opacity="0.1" />

  <!-- Left Dark Fade for Detail Page Text Overlay -->
  <rect width="1280" height="720" fill="url(#fadeLeft)" />

  <!-- Content Block on Left -->
  <g transform="translate(80, 150)" filter="url(#wideShadow)">
    <!-- Certificate and Formats -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="50" height="30" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
      <text x="25" y="21" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">U</text>

      <rect x="62" y="0" width="130" height="30" rx="6" fill="#ffb703" fill-opacity="0.2" stroke="#ffb703" stroke-width="1" stroke-opacity="0.5" />
      <text x="127" y="20" fill="#ffb703" font-size="13" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">2D • 3D • IMAX</text>

      <text x="210" y="21" fill="#aaaaaa" font-size="15" font-weight="700" font-family="system-ui, sans-serif">180 MINS • Hindi, Telugu, Tamil, Kannada</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">RAMAYANA: PART 1</text>

    <!-- Genres -->
    <text x="0" y="145" fill="#ffb703" font-size="18" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="1.5">ACTION • DRAMA • FANTASY</text>

    <!-- Description synopsis -->
    <foreignObject x="0" y="170" width="620" height="110">
      <p xmlns="http://www.w3.org/1999/xhtml" style="color: #cccccc; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; margin: 0;">
        The definitive cinematic adaptation of India’s timeless epic, tracking Prince Rama’s exile, devotion, and the momentous events leading up to the war against Lanka.
      </p>
    </foreignObject>

    <!-- Rating / Release Bar -->
    <g transform="translate(0, 310)">
      
        <rect x="0" y="0" width="220" height="46" rx="8" fill="#f59e0b" />
        <text x="110" y="30" fill="#000000" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">COMING SOON</text>
        <text x="240" y="30" fill="#cccccc" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Releasing 2027-10-20</text>
      
    </g>

    <!-- Credits -->
    <g transform="translate(0, 400)">
      <text x="0" y="0" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">DIRECTED BY: <tspan fill="#ffffff">Nitesh Tiwari</tspan></text>
      <text x="0" y="26" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">CAST: <tspan fill="#dddddd">Ranbir Kapoor, Sai Pallavi, Yash, Sunny Deol</tspan></text>
    </g>
  </g>
</svg>