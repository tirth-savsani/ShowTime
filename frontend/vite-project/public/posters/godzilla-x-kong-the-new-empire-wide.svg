<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#01050c" />
      <stop offset="45%" stop-color="#0b2545" />
      <stop offset="100%" stop-color="#020b18" />
    </linearGradient>
    <radialGradient id="wideGlow" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#0b2545" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#050505" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#050505" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="artWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d2ff" />
      <stop offset="100%" stop-color="#3a7bd5" />
    </linearGradient>
    <filter id="wideShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgWide)" />
  <rect width="1280" height="720" fill="url(#wideGlow)" />

  <!-- Right Hero Artwork Visual -->
  <g transform="translate(920, 360) scale(2.6)" filter="url(#wideShadow)">
    
        <circle cx="0" cy="0" r="60" fill="none" stroke="#00d2ff" stroke-width="3" stroke-dasharray="6,6" opacity="0.6" />
        <circle cx="0" cy="0" r="40" fill="none" stroke="#3a7bd5" stroke-width="4" opacity="0.8" />
        <circle cx="0" cy="0" r="20" fill="url(#artGlow)" />
        <line x1="-70" y1="0" x2="70" y2="0" stroke="#00d2ff" stroke-width="2" opacity="0.5" />
        <line x1="0" y1="-70" x2="0" y2="70" stroke="#00d2ff" stroke-width="2" opacity="0.5" />
      
  </g>
  <circle cx="920" cy="360" r="280" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="8,12" />
  <circle cx="920" cy="360" r="340" fill="none" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.1" />

  <!-- Left Dark Fade for Detail Page Text Overlay -->
  <rect width="1280" height="720" fill="url(#fadeLeft)" />

  <!-- Content Block on Left -->
  <g transform="translate(80, 150)" filter="url(#wideShadow)">
    <!-- Certificate and Formats -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="50" height="30" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
      <text x="25" y="21" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">UA</text>

      <rect x="62" y="0" width="130" height="30" rx="6" fill="#00d2ff" fill-opacity="0.2" stroke="#00d2ff" stroke-width="1" stroke-opacity="0.5" />
      <text x="127" y="20" fill="#00d2ff" font-size="13" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">2D • 3D • IMAX • 4DX</text>

      <text x="210" y="21" fill="#aaaaaa" font-size="15" font-weight="700" font-family="system-ui, sans-serif">115 MINS • English, Hindi, Tamil, Telugu</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">GODZILLA X KONG: THE NEW EMPIRE</text>

    <!-- Genres -->
    <text x="0" y="145" fill="#00d2ff" font-size="18" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="1.5">ACTION • SCI-FI • ADVENTURE</text>

    <!-- Description synopsis -->
    <foreignObject x="0" y="170" width="620" height="110">
      <p xmlns="http://www.w3.org/1999/xhtml" style="color: #cccccc; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; margin: 0;">
        An explosive battle pits the almighty Kong and fearsome Godzilla against a colossal undiscovered threat hidden deep within our hollow earth.
      </p>
    </foreignObject>

    <!-- Rating / Release Bar -->
    <g transform="translate(0, 310)">
      
        <rect x="0" y="0" width="180" height="46" rx="8" fill="#e50914" />
        <text x="90" y="30" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">★ 7.6 / 10</text>
        <text x="200" y="30" fill="#cccccc" font-size="16" font-weight="600" font-family="system-ui, sans-serif">215k+ reviews on ShowTime</text>
      
    </g>

    <!-- Credits -->
    <g transform="translate(0, 400)">
      <text x="0" y="0" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">DIRECTED BY: <tspan fill="#ffffff">Adam Wingard</tspan></text>
      <text x="0" y="26" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">CAST: <tspan fill="#dddddd">Rebecca Hall, Brian Tyree Henry, Dan Stevens, Kaylee Hottle</tspan></text>
    </g>
  </g>
</svg>