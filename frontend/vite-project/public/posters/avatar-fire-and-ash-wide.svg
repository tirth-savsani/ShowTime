<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720">
  <defs>
    <linearGradient id="bgWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040108" />
      <stop offset="45%" stop-color="#21093f" />
      <stop offset="100%" stop-color="#0a0316" />
    </linearGradient>
    <radialGradient id="wideGlow" cx="75%" cy="50%" r="60%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.5" />
      <stop offset="70%" stop-color="#21093f" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="fadeLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050505" stop-opacity="0.95" />
      <stop offset="40%" stop-color="#050505" stop-opacity="0.8" />
      <stop offset="75%" stop-color="#050505" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#050505" stop-opacity="0.1" />
    </linearGradient>
    <linearGradient id="artWide" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c77dff" />
      <stop offset="100%" stop-color="#7b2cbf" />
    </linearGradient>
    <filter id="wideShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="1280" height="720" fill="url(#bgWide)" />
  <rect width="1280" height="720" fill="url(#wideGlow)" />

  <!-- Right Hero Artwork Visual -->
  <g transform="translate(920, 360) scale(2.6)" filter="url(#wideShadow)">
    
        <circle cx="0" cy="0" r="50" fill="url(#artGlow)" />
        <ellipse cx="0" cy="0" rx="90" ry="24" fill="none" stroke="#c77dff" stroke-width="6" opacity="0.85" transform="rotate(-25)" />
        <circle cx="-15" cy="-15" r="10" fill="#ffffff" opacity="0.4" />
      
  </g>
  <circle cx="920" cy="360" r="280" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" stroke-dasharray="8,12" />
  <circle cx="920" cy="360" r="340" fill="none" stroke="#c77dff" stroke-width="1" stroke-opacity="0.1" />

  <!-- Left Dark Fade for Detail Page Text Overlay -->
  <rect width="1280" height="720" fill="url(#fadeLeft)" />

  <!-- Content Block on Left -->
  <g transform="translate(80, 150)" filter="url(#wideShadow)">
    <!-- Certificate and Formats -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="50" height="30" rx="6" fill="#ffffff" fill-opacity="0.15" stroke="#ffffff" stroke-width="1" stroke-opacity="0.4" />
      <text x="25" y="21" fill="#ffffff" font-size="16" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">UA</text>

      <rect x="62" y="0" width="130" height="30" rx="6" fill="#c77dff" fill-opacity="0.2" stroke="#c77dff" stroke-width="1" stroke-opacity="0.5" />
      <text x="127" y="20" fill="#c77dff" font-size="13" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">2D • 3D • IMAX • 4DX</text>

      <text x="210" y="21" fill="#aaaaaa" font-size="15" font-weight="700" font-family="system-ui, sans-serif">190 MINS • English, Hindi, Tamil, Telugu</text>
    </g>

    <!-- Main Title -->
    <text x="0" y="90" fill="#ffffff" font-size="52" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">AVATAR: FIRE AND ASH</text>

    <!-- Genres -->
    <text x="0" y="145" fill="#c77dff" font-size="18" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="1.5">SCI-FI • ADVENTURE • ACTION</text>

    <!-- Description synopsis -->
    <foreignObject x="0" y="170" width="620" height="110">
      <p xmlns="http://www.w3.org/1999/xhtml" style="color: #cccccc; font-family: system-ui, sans-serif; font-size: 16px; line-height: 1.5; margin: 0;">
        Jake Sully and Neytiri encounter the Ash People, an aggressive volcanic clan of Na’vi who challenge Pandora’s fragile ecological harmony.
      </p>
    </foreignObject>

    <!-- Rating / Release Bar -->
    <g transform="translate(0, 310)">
      
        <rect x="0" y="0" width="220" height="46" rx="8" fill="#f59e0b" />
        <text x="110" y="30" fill="#000000" font-size="18" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">COMING SOON</text>
        <text x="240" y="30" fill="#cccccc" font-size="16" font-weight="600" font-family="system-ui, sans-serif">Releasing 2027-12-18</text>
      
    </g>

    <!-- Credits -->
    <g transform="translate(0, 400)">
      <text x="0" y="0" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">DIRECTED BY: <tspan fill="#ffffff">James Cameron</tspan></text>
      <text x="0" y="26" fill="#888888" font-size="14" font-weight="700" font-family="system-ui, sans-serif">CAST: <tspan fill="#dddddd">Sam Worthington, Zoe Saldana, Sigourney Weaver, Stephen Lang</tspan></text>
    </g>
  </g>
</svg>