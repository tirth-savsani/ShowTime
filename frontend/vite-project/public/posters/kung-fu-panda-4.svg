<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="600" height="900">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#381e05" />
      <stop offset="35%" stop-color="#170c02" />
      <stop offset="75%" stop-color="#0a0501" />
      <stop offset="100%" stop-color="#020202" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#f77f00" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#381e05" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="artGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="600" height="900" fill="url(#bgGrad)" />
  <circle cx="300" cy="380" r="280" fill="url(#centerGlow)" />

  <!-- Geometric Frame Lines -->
  <rect x="25" y="25" width="550" height="850" rx="16" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.12" />
  <rect x="35" y="35" width="530" height="830" rx="12" fill="none" stroke="#ffb703" stroke-width="1" stroke-opacity="0.2" />

  <!-- Top Bar: Brand, Certificate, Formats -->
  <g transform="translate(50, 65)">
    <!-- Certificate Pill -->
    <rect x="0" y="0" width="46" height="28" rx="6" fill="#ffffff" fill-opacity="0.12" stroke="#ffffff" stroke-width="1" stroke-opacity="0.3" />
    <text x="23" y="19" fill="#ffffff" font-size="14" font-weight="900" font-family="system-ui, sans-serif" text-anchor="middle">U</text>

    <!-- Language / Format -->
    <rect x="56" y="0" width="90" height="28" rx="6" fill="#ffb703" fill-opacity="0.2" stroke="#ffb703" stroke-width="1" stroke-opacity="0.5" />
    <text x="101" y="19" fill="#ffb703" font-size="12" font-weight="800" font-family="system-ui, sans-serif" text-anchor="middle">2D • 3D</text>

    <!-- Runtime -->
    <text x="500" y="19" fill="#aaaaaa" font-size="13" font-weight="700" font-family="system-ui, sans-serif" text-anchor="end">94 MINS</text>
  </g>

  <!-- Central Stylized Cinema Artwork -->
  <g transform="translate(300, 360) scale(1.6)" filter="url(#shadow)">
    
        <circle cx="0" cy="0" r="45" fill="url(#artGlow)" />
        <g stroke="#ffb703" stroke-width="4" stroke-linecap="round" opacity="0.8">
          <line x1="0" y1="-65" x2="0" y2="-55" />
          <line x1="0" y1="55" x2="0" y2="65" />
          <line x1="-65" y1="0" x2="-55" y2="0" />
          <line x1="55" y1="0" x2="65" y2="0" />
          <line x1="-45" y1="-45" x2="-38" y2="-38" />
          <line x1="38" y1="38" x2="45" y2="45" />
          <line x1="45" y1="-45" x2="38" y2="-38" />
          <line x1="-38" y1="38" x2="-45" y2="45" />
        </g>
      
  </g>

  <!-- Decorative Cinema Lens Rings -->
  <circle cx="300" cy="360" r="170" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06" stroke-dasharray="4,8" />
  <circle cx="300" cy="360" r="210" fill="none" stroke="#ffb703" stroke-width="1" stroke-opacity="0.08" />

  <!-- Movie Title Block -->
  <g transform="translate(50, 600)" filter="url(#shadow)">
    <text x="0" y="0" fill="#ffffff" font-size="40" font-weight="900" font-family="system-ui, -apple-system, sans-serif" letter-spacing="0.5">KUNG FU PANDA 4</text>
    
  </g>

  <!-- Genre & Languages -->
  <g transform="translate(50, 665)">
    <text x="0" y="0" fill="#e0e0e0" font-size="14" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="1">
      ANIMATION • ACTION • COMEDY
    </text>
    <text x="500" y="0" fill="#999999" font-size="13" font-weight="600" font-family="system-ui, sans-serif" text-anchor="end">
      English, Hindi
    </text>
  </g>

  <!-- Rating Badge or Coming Soon Pill -->
  <rect x="50" y="700" width="165" height="42" rx="8" fill="#e50914" />
       <text x="65" y="728" fill="#ffffff" font-size="20" font-weight="900" font-family="system-ui, sans-serif">★ 7.7 / 10</text>
       <text x="225" y="726" fill="#cccccc" font-size="14" font-weight="600" font-family="system-ui, sans-serif">110k+ votes</text>

  <!-- Director & Cast Credit Line -->
  <g transform="translate(50, 775)">
    <text x="0" y="0" fill="#888888" font-size="12" font-weight="700" font-family="system-ui, sans-serif" letter-spacing="0.5">DIRECTED BY MIKE MITCHELL</text>
    <text x="0" y="20" fill="#bbbbbb" font-size="12" font-weight="500" font-family="system-ui, sans-serif">Starring: Jack Black, Awkwafina, Viola Davis</text>
  </g>

  <!-- Bottom CTA Banner -->
  <rect x="25" y="825" width="550" height="50" rx="10" fill="#111111" fill-opacity="0.7" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08" />
  <text x="300" y="856" fill="#ffffff" font-size="13" font-weight="800" font-family="system-ui, sans-serif" letter-spacing="2.5" text-anchor="middle">
    BOOK TICKETS ON SHOWTIME • ONLY IN CINEMAS
  </text>
</svg>